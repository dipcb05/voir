# =============================================================================
# Radiology-Specific Configuration
# =============================================================================
# Inherits from base.yaml — only overrides are listed here.

experiment:
  name: "radiology_only"

# --- Radiology Model ---
radiology:
  backbone: "densenet121"       # densenet121 | resnet50
  pretrained: true
  embedding_dim: 512
  projection_dim: 512           # Output of projection layer
  dropout: 0.3
  freeze_backbone: false        # Freeze pretrained weights
  unfreeze_after_epoch: null    # Unfreeze after N epochs (null = never freeze)

  # Image preprocessing
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet defaults
  normalize_std: [0.229, 0.224, 0.225]

  # Augmentation (training only)
  augmentation:
    random_horizontal_flip: true
    random_vertical_flip: false
    random_rotation: 15          # degrees
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: 0.05
    random_resized_crop: true
    crop_scale: [0.8, 1.0]

# --- Training overrides ---
training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 50
