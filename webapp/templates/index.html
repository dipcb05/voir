<!doctype html><html><head><meta charset="utf-8"><title>VOIR Portal</title><link rel="stylesheet" href="/static/app.css"></head><body><main><h1>VOIR Research Portal</h1><p>Research use only. Do not use for clinical decisions.</p><section><h2>Account</h2><form id="auth"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="12+ character password" required><button data-mode="register">Register</button><button data-mode="login">Login</button></form></section><section><h2>Dataset upload</h2><input id="dataset" type="file" accept=".zip,application/zip"><button id="upload">Upload approved ZIP</button><p id="dataset-status"></p></section><section><h2>Single image prediction</h2><input id="model-id" placeholder="Radiology model ID"><input id="image" type="file" accept="image/png,image/jpeg,image/tiff"><button id="predict">Predict</button><pre id="result"></pre></section></main><script src="/static/app.js"></script></body></html>
